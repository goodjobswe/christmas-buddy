name: christmas_buddy
description: A cosy Christmas countdown for Android. Find Pip the elf, watch the village light up and keep track of Santa's list.
publish_to: 'none'

version: 2.0.0+4

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  audioplayers: ^6.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.0
  package_info_plus: ^9.0.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons: # Run with "dart run flutter_launcher_icons"
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#14224F"

flutter_native_splash: # Run with "dart run flutter_native_splash:create"
  color: "#14224F"
  image: assets/icon/splash.png
  branding: assets/images/branding_400.png
  android_12:
    color: "#14224F"
    icon_background_color: "#14224F"
    branding: assets/images/branding.png

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/licenses/
    - assets/images/branding.png
    - assets/images/branding_400.png

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
    - family: Rochester
      fonts:
        - asset: assets/fonts/Rochester-Regular.ttf
