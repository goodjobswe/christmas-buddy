name: Checks
# Automatic runs on push and pull request are turned off to save Actions
# minutes. Run it by hand from the Actions tab, or restore the push and
# pull_request triggers to turn it back on.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
